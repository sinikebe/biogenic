#!/usr/sbin/nft -f
# Biogenic's internet listener, UDP 45772: a rate limit per source, and one
# combined ceiling for all sources at once, so a flood is dropped at the kernel
# before it reaches the encrypted handshake the server's own door sees
# (issue #68, docs/server.md §9.6).
#
# install-server.sh lays this file down at /etc/biogenic/ but NEVER loads it --
# a network firewall is yours to review and turn on. Not for 45771, the LAN
# port, which is never forwarded.
#
#   nft -c -f /etc/biogenic/nftables-internet.conf   # check it, load nothing
#   nft -f    /etc/biogenic/nftables-internet.conf   # load it now
#
# To load it at every boot, include it from /etc/nftables.conf and enable
# nftables.service; on Proxmox you may prefer the same rules on the host's
# firewall in front of the container.

table inet biogenic {
	set calls4 { type ipv4_addr; flags dynamic, timeout; timeout 1m; }
	set calls6 { type ipv6_addr; flags dynamic, timeout; timeout 1m; }
	set flood4 { type ipv4_addr; flags dynamic, timeout; timeout 1m; }
	set flood6 { type ipv6_addr; flags dynamic, timeout; timeout 1m; }
	chain input {
		type filter hook input priority filter - 1; policy accept;
		# Per source -- each /64 over IPv6: twenty new calls, then ten a minute.
		udp dport 45772 ct state new update @calls4 { ip saddr limit rate over 10/minute burst 20 packets } counter drop
		udp dport 45772 ct state new update @calls6 { ip6 saddr and ffff:ffff:ffff:ffff:: limit rate over 10/minute burst 20 packets } counter drop
		# Per source: 800 datagrams, then 400 a second (a friend swimming sends ~100/s).
		udp dport 45772 update @flood4 { ip saddr limit rate over 400/second burst 800 packets } counter drop
		udp dport 45772 update @flood6 { ip6 saddr and ffff:ffff:ffff:ffff:: limit rate over 400/second burst 800 packets } counter drop
		# All sources together, so a distributed burst cannot pass the per-source
		# sets unbounded: 2400 datagrams, then 1200 a second across the whole port.
		udp dport 45772 limit rate over 1200/second burst 2400 packets counter drop
	}
}
