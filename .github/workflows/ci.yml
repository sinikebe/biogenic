name: CI

# Pull-request validation: exports exactly the way release.yml does, so an
# export that would break the release is caught before merge.
#
# This workflow never touches a secret and never publishes anything, which is
# what makes it safe to run on pull requests from forks.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable

jobs:
  build:
    name: Export check
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot
        run: bash ci/install_godot.sh

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Collect patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/collect_changes.sh

      - name: Stamp build version
        id: version
        run: bash ci/prepare_build.sh

      - name: Resolve throwaway signing key
        id: keystore
        # No secret is passed, so this always generates a one-off debug key.
        # Signature stability does not matter for a check that ships nothing.
        run: bash ci/setup_keystore.sh

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Check for script and scene errors
        # Boots each scene headless. Any parse error, bad preload or broken
        # scene reference is caught here, before the export.
        #
        # TWO things are load-bearing and both were measured, not assumed.
        #
        # 1. GODOT EXITS 0 ANYWAY. A duplicate function in normal_mode.gd --
        #    the booted scene's OWN script -- produces a SCRIPT ERROR and
        #    exit 0; the same fault in cell.gd, which it preloads, produces
        #    136 of them and exit 0. A step that only runs the binary passes
        #    either way, so the output has to be read. That is what the grep
        #    is for, and it is the whole reason this step is a script.
        #
        # 2. EVERY SCENE HERE IS REACHED BY A DIFFERENT ROUTE. The main scene
        #    is the LAUNCHER, and the launcher never touches game/ -- it only
        #    gets there when a player presses Play. replay.tscn is reached by
        #    neither: normal_mode.gd loads it from a STRING at the moment the
        #    button is pressed, because replay.gd preloads normal_mode.gd and
        #    a preload back would be a cycle. So nothing preloads replay.gd or
        #    panes.gd, and measured, a duplicate function in panes.gd passes
        #    all three of the other scenes with zero error lines. The player
        #    would have found it by pressing `watch`.
        #
        # Seconds, against an export measured in minutes.
        run: |
          set -uo pipefail
          fail=0
          for scene in "" \
                       "res://game/mode_select.tscn" \
                       "res://game/normal/normal_mode.tscn" \
                       "res://game/replay/replay.tscn"; do
            name="${scene:-main scene (launcher)}"
            echo "--- booting $name"
            # shellcheck disable=SC2086
            if ! out=$(~/godot/godot --headless --path . --quit-after 120 $scene 2>&1); then
              printf '%s\n' "$out"
              echo "::error::$name exited non-zero"
              fail=1
              continue
            fi
            if printf '%s\n' "$out" \
                 | grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file"; then
              echo "::error::$name reported script or scene errors"
              fail=1
            fi
          done
          exit "$fail"

      - name: Check the input path
        # The step above proves every scene LOADS. It cannot prove any of them
        # RESPONDS, and the gap is not theoretical.
        #
        # All four scenes boot with ZERO input events, and the whole touch path
        # -- `cell.gd`'s `_claim`, `controls.gd`'s `press`/`release`, the lean
        # a division is answered with -- is reachable only from a press. The
        # nodes that own it are held in untyped `Node` references on purpose
        # (the preload cycle is real: cilia.gd -> genome.gd -> cell.gd, and
        # controls.gd -> cilia.gd), and GDScript treats an unknown member on an
        # untyped base as UNSAFE_PROPERTY_ACCESS rather than an error. Measured:
        # rename a constant in controls.gd and leave `cell.gd`'s use of it
        # stale, and `--check-only` on cell.gd exits 0 printing nothing while
        # all four scenes boot with zero error lines. The first player's dash
        # tap finds it, with `Invalid access to property or key 'DASH'`.
        #
        # So this drives a few presses instead. Same grep as above, plus one
        # positive assertion -- that the division actually commits -- because a
        # step that only greps for errors goes green if the harness quietly
        # stops driving anything. Measured against the two faults it exists for:
        # the stale constant fails it under all three schemes, and so does the
        # input gate that used to ignore every press for the 1.5s of the pinch.
        #
        # `--size=` is load-bearing. Canvas coordinates are converted through
        # `get_screen_transform()`, and a headless run with no window of its own
        # scales canvas 96,624 down to window 5,31 -- a 96px pad becomes five
        # pixels, every press lands on nothing, and the check passes while
        # testing nothing at all.
        #
        # `tools/` is excluded from export on both presets, so none of this
        # reaches a player. About fifteen seconds for all three schemes.
        run: |
          set -uo pipefail
          fail=0
          genome="cytostome:1,cirrus:1,flagellum:1,axoneme:1,myoneme:1"
          for scheme in 0 1 2; do
            echo "--- driving scheme $scheme"
            if ! out=$(~/godot/godot --headless --path . --fixed-fps 60 \
                         --quit-after 660 res://tools/drive.tscn -- \
                         --size=1280x720 --seed=12345 --scheme="$scheme" \
                         --radius=40 --genome="$genome" --trace=2.0 \
                         --press=1.0:144,624,0 --press=1.2:1064,624,1 \
                         --touch=1.6:1184,624 --slide=1.8:200,624,0 \
                         --lift=2.0:0 --lift=2.1:1 \
                         --press=3.0:216,624,0 --lift=8.0:0 \
                         --mouse-press=9.0:96,624 --mouse-slide=9.2:640,400 \
                         --mouse-lift=9.4 2>&1); then
              printf '%s\n' "$out"
              echo "::error::scheme $scheme exited non-zero"
              fail=1
              continue
            fi
            if printf '%s\n' "$out" \
                 | grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file"; then
              echo "::error::scheme $scheme reported script errors under input"
              fail=1
            fi
            # The cell is forced to DIVIDE_RADIUS, so it splits at once and the
            # press at 3.0s is a held lean -- the port half under `anywhere`,
            # the stick hard over under `stick`, the starboard pad under
            # `pads`. A daughter is half the area, so r40 becomes r28.28: any
            # r2x in the trace is a division that was answered.
            if ! printf '%s\n' "$out" | grep -qE "^\[trace\].*me r2[0-9]\."; then
              printf '%s\n' "$out" | grep -E "^\[trace\]" || true
              echo "::error::scheme $scheme never committed a daughter -- a held lean did not reach the division"
              fail=1
            fi
          done
          exit "$fail"

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.path }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/${{ steps.version.outputs.apk_name }}

      - name: Export Windows executable
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/${{ steps.version.outputs.exe_name }}

      - name: Export content packs
        run: |
          mkdir -p build/content
          ~/godot/godot --headless --path . --export-pack "Android" build/content/content-android.pck
          ~/godot/godot --headless --path . --export-pack "Windows Desktop" build/content/content-windows.pck

      - name: Check the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning ci/*.sh

      - name: Upload build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: build-pr-${{ github.event.pull_request.number || github.run_id }}
          path: |
            build/android/${{ steps.version.outputs.apk_name }}
            build/windows/${{ steps.version.outputs.exe_name }}
            build/content/*.pck
          if-no-files-found: error
          retention-days: 7
