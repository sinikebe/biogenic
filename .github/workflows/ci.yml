name: CI

# Pull-request validation: exports exactly the way release.yml does, so an
# export that would break the release is caught before merge.
#
# This workflow never touches a secret and never publishes anything, which is
# what makes it safe to run on pull requests from forks.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable

jobs:
  build:
    name: Export check
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot
        run: bash ci/install_godot.sh

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Collect patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/collect_changes.sh

      - name: Stamp build version
        id: version
        run: bash ci/prepare_build.sh

      - name: Resolve throwaway signing key
        id: keystore
        # No secret is passed, so this always generates a one-off debug key.
        # Signature stability does not matter for a check that ships nothing.
        run: bash ci/setup_keystore.sh

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Check for script and scene errors
        # Boots each scene headless. Any parse error, bad preload or broken
        # scene reference is caught here, before the export.
        #
        # TWO things are load-bearing and both were measured, not assumed.
        #
        # 1. GODOT EXITS 0 ANYWAY. A duplicate function in normal_mode.gd --
        #    the booted scene's OWN script -- produces a SCRIPT ERROR and
        #    exit 0; the same fault in cell.gd, which it preloads, produces
        #    136 of them and exit 0. A step that only runs the binary passes
        #    either way, so the output has to be read. That is what the grep
        #    is for, and it is the whole reason this step is a script.
        #
        # 2. EVERY SCENE HERE IS REACHED BY A DIFFERENT ROUTE. The main scene
        #    is the LAUNCHER, and the launcher never touches game/ -- it only
        #    gets there when a player presses Play. replay.tscn is reached by
        #    neither: normal_mode.gd loads it from a STRING at the moment the
        #    button is pressed, because replay.gd preloads normal_mode.gd and
        #    a preload back would be a cycle. So nothing preloads replay.gd or
        #    panes.gd, and measured, a duplicate function in panes.gd passes
        #    all three of the other scenes with zero error lines. The player
        #    would have found it by pressing `watch`.
        #
        #    earshot.tscn is in the same position for the same reason:
        #    mode_select.gd reaches it by STRING, so nothing preloads
        #    earshot.gd and no other scene here would ever compile it.
        #
        #    server.tscn is reached by neither route: only the Linux Server
        #    export boots it, through `run/main_scene.server`. It is booted here
        #    with `--no-update`, so this step never reaches the network.
        #
        # Seconds, against an export measured in minutes.
        run: |
          set -uo pipefail
          fail=0
          for scene in "" \
                       "res://game/mode_select.tscn" \
                       "res://game/net/earshot.tscn" \
                       "res://game/normal/normal_mode.tscn" \
                       "res://game/replay/replay.tscn" \
                       "res://game/server/server.tscn -- --no-update"; do
            name="${scene:-main scene (launcher)}"
            echo "--- booting $name"
            # shellcheck disable=SC2086
            if ! out=$(~/godot/godot --headless --path . --quit-after 120 $scene 2>&1); then
              printf '%s\n' "$out"
              echo "::error::$name exited non-zero"
              fail=1
              continue
            fi
            if printf '%s\n' "$out" \
                 | grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file"; then
              echo "::error::$name reported script or scene errors"
              fail=1
            fi
          done
          exit "$fail"

      - name: Check the input path
        # The step above proves every scene LOADS. It cannot prove any of them
        # RESPONDS, and the gap is not theoretical.
        #
        # All four scenes boot with ZERO input events, and the whole touch path
        # -- `cell.gd`'s `_claim`, `controls.gd`'s `press`/`release`, the lean
        # a division is answered with -- is reachable only from a press. The
        # nodes that own it are held in untyped `Node` references on purpose
        # (the preload cycle is real: cilia.gd -> genome.gd -> cell.gd, and
        # controls.gd -> cilia.gd), and GDScript treats an unknown member on an
        # untyped base as UNSAFE_PROPERTY_ACCESS rather than an error. Measured:
        # rename a constant in controls.gd and leave `cell.gd`'s use of it
        # stale, and `--check-only` on cell.gd exits 0 printing nothing while
        # all four scenes boot with zero error lines. The first player's dash
        # tap finds it, with `Invalid access to property or key 'DASH'`.
        #
        # So this drives a few presses instead. Same grep as above, plus one
        # positive assertion -- that the division actually commits -- because a
        # step that only greps for errors goes green if the harness quietly
        # stops driving anything. Measured against the two faults it exists for:
        # the stale constant fails it under all three schemes, and so does the
        # input gate that used to ignore every press for the 1.5s of the pinch.
        #
        # `--size=` is load-bearing. Canvas coordinates are converted through
        # `get_screen_transform()`, and a headless run with no window of its own
        # scales canvas 96,624 down to window 5,31 -- a 96px pad becomes five
        # pixels, every press lands on nothing, and the check passes while
        # testing nothing at all.
        #
        # `tools/` is excluded from export on every preset, so none of this
        # reaches a player. About fifteen seconds for all three schemes.
        run: |
          set -uo pipefail
          fail=0
          genome="cytostome:1,cirrus:1,flagellum:1,axoneme:1,myoneme:1"
          for scheme in 0 1 2; do
            echo "--- driving scheme $scheme"
            if ! out=$(~/godot/godot --headless --path . --fixed-fps 60 \
                         --quit-after 660 res://tools/drive.tscn -- \
                         --size=1280x720 --seed=12345 --scheme="$scheme" \
                         --radius=40 --genome="$genome" --trace=2.0 \
                         --press=1.0:144,624,0 --press=1.2:1064,624,1 \
                         --touch=1.6:1184,624 --slide=1.8:200,624,0 \
                         --lift=2.0:0 --lift=2.1:1 \
                         --press=3.0:216,624,0 --lift=8.0:0 \
                         --mouse-press=9.0:96,624 --mouse-slide=9.2:640,400 \
                         --mouse-lift=9.4 2>&1); then
              printf '%s\n' "$out"
              echo "::error::scheme $scheme exited non-zero"
              fail=1
              continue
            fi
            if printf '%s\n' "$out" \
                 | grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file"; then
              echo "::error::scheme $scheme reported script errors under input"
              fail=1
            fi
            # The cell is forced to DIVIDE_RADIUS, so it splits at once and the
            # press at 3.0s is a held lean -- the port half under `anywhere`,
            # the stick hard over under `stick`, the starboard pad under
            # `pads`. A daughter is half the area, so r40 becomes r28.28: any
            # r2x in the trace is a division that was answered.
            if ! printf '%s\n' "$out" | grep -qE "^\[trace\].*me r2[0-9]\."; then
              printf '%s\n' "$out" | grep -E "^\[trace\]" || true
              echo "::error::scheme $scheme never committed a daughter -- a held lean did not reach the division"
              fail=1
            fi
          done
          exit "$fail"

      - name: Check the Back gesture
        # Android Back is the one control this project could not test. A real
        # Back propagates NOTIFICATION_WM_GO_BACK_REQUEST and *then* emits
        # `go_back_requested`, which SceneTree has connected to its own quit
        # check; `tools/drive.gd --back-at=` fired only the first half for five
        # phases, so a handler that flipped `quit_on_go_back` mid-propagation
        # read as fine here and killed the app on a phone. That is issue #23,
        # and the fix for it re-created it two files over before this existed.
        #
        # `tools/back_probe.tscn` fires both halves and outlives the scene
        # change, which `tools/drive.gd` cannot -- it is `current_scene`, so
        # `change_scene_to_file` frees it mid-test and the restore it is
        # supposed to be checking becomes unobservable.
        #
        # Grepped, not trusted to the exit code, and this step is the sharpest
        # example of why that rule exists anywhere in this repo: with the bug
        # re-introduced the app quits in the middle of the probe and Godot
        # still exits 0, printing two PASS lines and no failure of any kind.
        run: |
          set -uo pipefail
          out=$(~/godot/godot --headless --path . res://tools/back_probe.tscn 2>&1) || true
          printf '%s\n' "$out" | grep -E "^\[back-probe\]" || true
          if ! printf '%s\n' "$out" | grep -q "^\[back-probe\] ALL PASS$"; then
            printf '%s\n' "$out" | grep -E "SCRIPT ERROR|Parse Error|ERROR:" || true
            echo "::error::Back did not walk back out of the game cleanly -- see the probe lines above"
            exit 1
          fi
          # A clean run prints no script error at all. One that does has lost
          # the rest of whatever function it was in -- a Godot runtime error
          # aborts only that function, and its caller goes on to print ALL PASS
          # over the checks it skipped.
          if printf '%s\n' "$out" | grep -qE "SCRIPT ERROR|Parse Error"; then
            printf '%s\n' "$out" | grep -E -A2 "SCRIPT ERROR|Parse Error"
            echo "::error::the Back probe hit a script error -- checks after it did not run"
            exit 1
          fi

      - name: Check the LAN session
        # Two sessions in ONE headless process, talking ENet over loopback: a
        # guest through a SceneMultiplayer bound to its own subtree with
        # SceneTree.set_multiplayer(api, path), and a host reading its own
        # ENetMultiplayerPeer, every frame through one gate
        # (docs/design/net-hardening.md, part A). Full handshake, raw frames
        # both ways, and the version-skew refusal. Then the door and the gate
        # (`limits`): hostile peers against a host of their own each. Then,
        # with no socket at all, the shared pond's
        # field rules (`pond-field`): two players in one food.gd, the eating
        # rule both ways, the per-player water, and a mirror that must perceive
        # exactly what the field does. Then the dedicated server
        # (`game/server/`) with two real guests on this build's own PROTOCOL 4
        # guest code, and its update decisions against a fake release feed and
        # a loopback HTTP server -- no network.
        #
        # Grepped for a POSITIVE line, for the reason the two steps above spell
        # out twice: Godot exits 0 through script errors, so a network step that
        # only ran would go green with the socket never opened. The probe prints
        # `[net-probe] PASS <what>` per check and `ALL PASS` only if none failed.
        #
        # NO --fixed-fps here, unlike the input step. Every clock in
        # game/net/net_session.gd is wall time -- Android stops the main loop
        # when the app leaves the foreground, so a frame accumulator would
        # report a peer that has been gone two minutes as fresh -- and a
        # headless build at several thousand frames a second would outrun the
        # session's clocks in simulated time: twenty state frames a second
        # while a body swims, the 2 Hz beat while nothing does. --quit-after is
        # a backstop only. The probe caps itself at 500 frames a second and
        # quits itself in seventy to seventy-five seconds: some eight in the
        # socket-free pond-field section, which runs inside one frame and
        # spends none of the budget, eighteen to twenty-one in `limits`, at up
        # to 100 frames a second, about twenty-three in the pond section, two
        # real runs over loopback at up to 250 frames a second, and about six
        # in the server's. Its pond timings are counted in frames, not wall
        # milliseconds, so a loaded runner slows the step without failing it.
        # It prints its own frame count -- about 8,500 to 8,900 -- so the
        # margin on 20000 is visible in the log.
        #
        # WHAT THIS CANNOT SEE, and it is most of a real network: latency,
        # jitter, loss, reordering, MTU, NAT, Wi-Fi roaming, Android doze or
        # `onActivityStopped`, and `godotengine/godot#105726` -- ENet clients
        # disconnecting at random over a LAN, which is documented NOT to
        # reproduce on localhost, which is exactly this recipe. Two phones on
        # real Wi-Fi for half an hour is the test this is not.
        run: |
          set -uo pipefail
          out=$(~/godot/godot --headless --path . --quit-after 20000 \
                  res://tools/net_probe.tscn 2>&1) || true
          printf '%s\n' "$out" | grep -E "^\[net-probe\]" || true
          if ! printf '%s\n' "$out" | grep -q "^\[net-probe\] ALL PASS$"; then
            printf '%s\n' "$out" | grep -E "SCRIPT ERROR|Parse Error|ERROR:" || true
            echo "::error::the LAN session did not come up -- see the probe lines above"
            exit 1
          fi
          # The same guard as the Back step's, and it matters more here: the
          # pond-field section reaches food.gd's own functions by name, so a
          # rename there is a runtime error that skips the rest of a section
          # while the probe still prints ALL PASS. A clean run prints none.
          if printf '%s\n' "$out" | grep -qE "SCRIPT ERROR|Parse Error"; then
            printf '%s\n' "$out" | grep -E -A2 "SCRIPT ERROR|Parse Error"
            echo "::error::the LAN probe hit a script error -- checks after it did not run"
            exit 1
          fi

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.path }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/${{ steps.version.outputs.apk_name }}

      - name: Export Windows executable
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/${{ steps.version.outputs.exe_name }}

      - name: Export the Linux server
        run: |
          mkdir -p build/linux
          ~/godot/godot --headless --path . --export-release "Linux Server" build/linux/biogenic-server.x86_64

      - name: Export content packs
        run: |
          mkdir -p build/content
          ~/godot/godot --headless --path . --export-pack "Android" build/content/content-android.pck
          ~/godot/godot --headless --path . --export-pack "Windows Desktop" build/content/content-windows.pck
          ~/godot/godot --headless --path . --export-pack "Linux Server" build/content/content-linux.pck

      - name: Smoke-boot the Linux server
        # **The exported binary, not the editor**, because the thing that makes
        # it a server is only true of an export: an official 4.7 release
        # template cannot be told which scene to run, so it boots
        # `run/main_scene.server` through the preset's `server` feature, and a
        # preset or override that went wrong boots the launcher instead -- and
        # waits for a Play press forever, printing nothing wrong. So this greps
        # for the server's own positive line, READY, and for nothing else.
        #
        # **And it stops the way systemd stops it**: by the stop file its unit's
        # ExecStop touches, because Godot does not catch SIGTERM (measured: the
        # process dies at once, status 143). A clean stop prints `[server]
        # stopped` and exits 0. `--no-update` keeps the network out of it.
        #
        # Grepped for SCRIPT ERROR and Parse Error as well, for the reason the
        # scene step above spells out: Godot exits 0 straight through them.
        #
        # **And it answers the pre-flight**: every installed server asks a new
        # build `--headless --version` before swapping it in, and refuses one
        # that does not exit 0 naming a version (game/server/updater.gd,
        # `preflight()`). A template that answered any other way would be
        # refused by every server there is, so it is refused here first.
        run: |
          set -uo pipefail
          stop="$RUNNER_TEMP/biogenic-server.stop"
          log="$RUNNER_TEMP/biogenic-server.log"
          rm -f "$stop"
          timeout 90 build/linux/biogenic-server.x86_64 --headless -- \
            --no-update --stop-file="$stop" > "$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            grep -q '^\[server\] READY' "$log" && break
            sleep 0.2
          done
          touch "$stop"
          # `|| code=$?`, not `code=$?` after it: the step shell is `bash -e`,
          # which would leave on a failed wait before the log is printed.
          code=0
          wait "$pid" || code=$?
          cat "$log"
          fail=0
          if ! grep -q '^\[server\] READY' "$log"; then
            echo "::error::the exported server never said READY -- did it boot the launcher instead?"
            fail=1
          fi
          if ! grep -q '^\[server\] stopped' "$log" || [ "$code" -ne 0 ]; then
            echo "::error::the exported server did not stop cleanly on its stop file (exit $code)"
            fail=1
          fi
          if grep -E "SCRIPT ERROR|Parse Error" "$log"; then
            echo "::error::the exported server reported script errors"
            fail=1
          fi
          # The updater's pre-flight, as it asks it: exit 0, and a version (N.M...).
          asked=0
          said=$(build/linux/biogenic-server.x86_64 --headless --version 2>/dev/null) || asked=$?
          echo "pre-flight: --version exited $asked and said '$said'"
          if [ "$asked" -ne 0 ] || ! [[ "$said" =~ ^[1-9][0-9]*\.[0-9] ]]; then
            echo "::error::the exported server fails the pre-flight every installed server puts a new build through"
            fail=1
          fi
          exit "$fail"

      - name: Check the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning ci/*.sh server/*.sh

      - name: Upload build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: build-pr-${{ github.event.pull_request.number || github.run_id }}
          path: |
            build/android/${{ steps.version.outputs.apk_name }}
            build/windows/${{ steps.version.outputs.exe_name }}
            build/linux/biogenic-server.x86_64
            build/content/*.pck
          if-no-files-found: error
          retention-days: 7
