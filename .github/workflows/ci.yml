name: CI

# Pull-request validation: exports exactly the way release.yml does, so an
# export that would break the release is caught before merge.
#
# This workflow never touches a secret and never publishes anything, which is
# what makes it safe to run on pull requests from forks.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: stable

jobs:
  build:
    name: Export check
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          # ci/install_godot.sh verifies a restored engine against the manifest it
          # wrote at install and fails the job on any difference. actions/cache
          # never saves over a key that matched, so a bad entry is dropped by
          # bumping -verified-vN -- the template's key, copied by hand.
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-verified-v1

      - name: Install Godot
        run: bash ci/install_godot.sh

      - name: Verify the engine
        # Issue #78: the engine that builds a release is the one pinned here,
        # byte for byte. ci/install_godot.sh, from the launcher template, checks
        # a download against Godot's published SHA512-SUMS.txt and a cache hit
        # against the record it wrote at install -- but the sums come from the
        # same place as the bytes, and the record from the same cache entry, so
        # neither proves where the engine came from. This manifest does: it
        # lives in the repository, outside the cache. Every file the script put
        # in place, editor and every export template, is held to it, on a fresh
        # install and on a cache hit alike. Nothing else may lie beside them but
        # the script's own two records: one empty `._sc_` next to the editor
        # puts it in self-contained mode, which exports with templates from
        # ~/godot/editor_data instead (measured). The manifest was made from the
        # archives after checking them against Godot's own SHA512-SUMS.txt;
        # docs/engine.md says how, and what else an engine upgrade must repeat.
        run: |
          cd ~
          manifest="${GITHUB_WORKSPACE}/.github/engine/godot-${GODOT_VERSION}-${GODOT_RELEASE}.sha512"
          sha512sum --check --strict --quiet "${manifest}"
          # install_godot.sh's records, skipped by exact path and nowhere else:
          # the engine never reads them, and the template may change their text.
          diff <(sed 's/^[0-9a-f]*  //' "${manifest}" | LC_ALL=C sort) \
               <(find godot .local/share/godot/export_templates ! -type d \
                   ! -path godot/.verified-install.sha512 \
                   ! -path ".local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/.verified-install.sha512" \
                   | LC_ALL=C sort) \
            || { echo "::error::files the manifest does not list lie beside the engine (the > lines)"; exit 1; }
          echo "verified: $(~/godot/godot --version)"

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          # Named for the series alone: 4.7.2 reads editor_settings-4.7.tres,
          # and a file named for the patch release is never read at all.
          series="$(cut -d. -f1,2 <<< "${GODOT_VERSION}")"
          cat > ~/.config/godot/editor_settings-${series}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Collect patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/collect_changes.sh

      - name: Stamp build version
        id: version
        run: bash ci/prepare_build.sh

      - name: Resolve throwaway signing key
        id: keystore
        # No secret is passed, so this always generates a one-off debug key.
        # Signature stability does not matter for a check that ships nothing.
        run: bash ci/setup_keystore.sh

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Check for script and scene errors
        # Boots each scene headless. Any parse error, bad preload or broken
        # scene reference is caught here, before the export.
        #
        # TWO things are load-bearing and both were measured, not assumed.
        #
        # 1. GODOT EXITS 0 ANYWAY. A duplicate function in normal_mode.gd --
        #    the booted scene's OWN script -- produces a SCRIPT ERROR and
        #    exit 0; the same fault in cell.gd, which it preloads, produces
        #    136 of them and exit 0. A step that only runs the binary passes
        #    either way, so the output has to be read. That is what the grep
        #    is for, and it is the whole reason this step is a script.
        #
        # 2. EVERY SCENE HERE IS REACHED BY A DIFFERENT ROUTE. The main scene
        #    is the LAUNCHER, and the launcher never touches game/ -- it only
        #    gets there when a player presses Play. replay.tscn is reached by
        #    neither: normal_mode.gd loads it from a STRING at the moment the
        #    button is pressed, because replay.gd preloads normal_mode.gd and
        #    a preload back would be a cycle. So nothing preloads replay.gd or
        #    panes.gd, and measured, a duplicate function in panes.gd passes
        #    all three of the other scenes with zero error lines. The player
        #    would have found it by pressing `watch`.
        #
        #    earshot.tscn is in the same position for the same reason:
        #    mode_select.gd reaches it by STRING, so nothing preloads
        #    earshot.gd and no other scene here would ever compile it. So is
        #    far.tscn, the same screen opened far: an inherited scene that
        #    sets one property, reached by its own string, and the only boot
        #    that ever reads `far = true`.
        #
        #    server.tscn is reached by neither route: only the Linux Server
        #    export boots it, through `run/main_scene.server`. It is booted here
        #    with `--no-update`, so it never looks for an update. It does start
        #    one UPnP search for a router (game/net/port_forward.gd,
        #    docs/server.md §9.3), which takes four seconds to find nothing on
        #    a runner; the boot ends first, so only its "looking" line prints.
        #
        # Seconds, against an export measured in minutes.
        run: |
          set -uo pipefail
          fail=0
          for scene in "" \
                       "res://game/mode_select.tscn" \
                       "res://game/net/earshot.tscn" \
                       "res://game/net/far.tscn" \
                       "res://game/normal/normal_mode.tscn" \
                       "res://game/replay/replay.tscn" \
                       "res://game/server/server.tscn -- --no-update"; do
            name="${scene:-main scene (launcher)}"
            echo "--- booting $name"
            # shellcheck disable=SC2086
            if ! out=$(~/godot/godot --headless --path . --quit-after 120 $scene 2>&1); then
              printf '%s\n' "$out"
              echo "::error::$name exited non-zero"
              fail=1
              continue
            fi
            if printf '%s\n' "$out" \
                 | grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file"; then
              echo "::error::$name reported script or scene errors"
              fail=1
            fi
          done
          exit "$fail"

      - name: Check the input path
        # The step above proves every scene LOADS. It cannot prove any of them
        # RESPONDS, and the gap is not theoretical.
        #
        # All four scenes boot with ZERO input events, and the whole touch path
        # -- `cell.gd`'s `_claim`, `controls.gd`'s `press`/`release`, the lean
        # a division is answered with -- is reachable only from a press. The
        # nodes that own it are held in untyped `Node` references on purpose
        # (the preload cycle is real: cilia.gd -> genome.gd -> cell.gd, and
        # controls.gd -> cilia.gd), and GDScript treats an unknown member on an
        # untyped base as UNSAFE_PROPERTY_ACCESS rather than an error. Measured:
        # rename a constant in controls.gd and leave `cell.gd`'s use of it
        # stale, and `--check-only` on cell.gd exits 0 printing nothing while
        # all four scenes boot with zero error lines. The first player's dash
        # tap finds it, with `Invalid access to property or key 'DASH'`.
        #
        # So this drives a few presses instead. Same grep as above, plus one
        # positive assertion -- that the division actually commits -- because a
        # step that only greps for errors goes green if the harness quietly
        # stops driving anything. Measured against the two faults it exists for:
        # the stale constant fails it under all three schemes, and so does the
        # input gate that used to ignore every press for the 1.5s of the pinch.
        #
        # `--size=` is load-bearing. Canvas coordinates are converted through
        # `get_screen_transform()`, and a headless run with no window of its own
        # scales canvas 96,624 down to window 5,31 -- a 96px pad becomes five
        # pixels, every press lands on nothing, and the check passes while
        # testing nothing at all.
        #
        # `tools/` is excluded from export on every preset, so none of this
        # reaches a player. About fifteen seconds for all three schemes.
        run: |
          set -uo pipefail
          fail=0
          genome="cytostome:1,cirrus:1,flagellum:1,axoneme:1,myoneme:1"
          for scheme in 0 1 2; do
            echo "--- driving scheme $scheme"
            if ! out=$(~/godot/godot --headless --path . --fixed-fps 60 \
                         --quit-after 660 res://tools/drive.tscn -- \
                         --size=1280x720 --seed=12345 --scheme="$scheme" \
                         --radius=40 --genome="$genome" --trace=2.0 \
                         --press=1.0:144,624,0 --press=1.2:1064,624,1 \
                         --touch=1.6:1184,624 --slide=1.8:200,624,0 \
                         --lift=2.0:0 --lift=2.1:1 \
                         --press=3.0:216,624,0 --lift=8.0:0 \
                         --mouse-press=9.0:96,624 --mouse-slide=9.2:640,400 \
                         --mouse-lift=9.4 2>&1); then
              printf '%s\n' "$out"
              echo "::error::scheme $scheme exited non-zero"
              fail=1
              continue
            fi
            if printf '%s\n' "$out" \
                 | grep -E "SCRIPT ERROR|Parse Error|Failed to load|Cannot open file"; then
              echo "::error::scheme $scheme reported script errors under input"
              fail=1
            fi
            # The cell is forced to DIVIDE_RADIUS, so it splits at once and the
            # press at 3.0s is a held lean -- the port half under `anywhere`,
            # the stick hard over under `stick`, the starboard pad under
            # `pads`. A daughter is half the area, so r40 becomes r28.28: any
            # r2x in the trace is a division that was answered.
            if ! grep -qE "^\[trace\].*me r2[0-9]\." <<< "$out"; then
              printf '%s\n' "$out" | grep -E "^\[trace\]" || true
              echo "::error::scheme $scheme never committed a daughter -- a held lean did not reach the division"
              fail=1
            fi
          done
          exit "$fail"

      - name: Check the Back gesture
        # Android Back is the one control this project could not test. A real
        # Back propagates NOTIFICATION_WM_GO_BACK_REQUEST and *then* emits
        # `go_back_requested`, which SceneTree has connected to its own quit
        # check; `tools/drive.gd --back-at=` fired only the first half for five
        # phases, so a handler that flipped `quit_on_go_back` mid-propagation
        # read as fine here and killed the app on a phone. That is issue #23,
        # and the fix for it re-created it two files over before this existed.
        #
        # `tools/back_probe.tscn` fires both halves and outlives the scene
        # change, which `tools/drive.gd` cannot -- it is `current_scene`, so
        # `change_scene_to_file` frees it mid-test and the restore it is
        # supposed to be checking becomes unobservable.
        #
        # Grepped, not trusted to the exit code, and this step is the sharpest
        # example of why that rule exists anywhere in this repo: with the bug
        # re-introduced the app quits in the middle of the probe and Godot
        # still exits 0, printing two PASS lines and no failure of any kind.
        run: |
          set -uo pipefail
          out=$(~/godot/godot --headless --path . res://tools/back_probe.tscn 2>&1) || true
          printf '%s\n' "$out" | grep -E "^\[back-probe\]" || true
          if ! grep -q "^\[back-probe\] ALL PASS$" <<< "$out"; then
            printf '%s\n' "$out" | grep -E "SCRIPT ERROR|Parse Error|ERROR:" || true
            echo "::error::Back did not walk back out of the game cleanly -- see the probe lines above"
            exit 1
          fi
          # A clean run prints no script error at all. One that does has lost
          # the rest of whatever function it was in -- a Godot runtime error
          # aborts only that function, and its caller goes on to print ALL PASS
          # over the checks it skipped. A here-string, not `printf | grep -q`:
          # under pipefail, grep -q leaving at an early match is SIGPIPE to
          # printf, and on a log past the pipe's 64 KiB a match near its top
          # reads as no match at all (#110).
          if grep -qE "SCRIPT ERROR|Parse Error" <<< "$out"; then
            printf '%s\n' "$out" | grep -E -A2 "SCRIPT ERROR|Parse Error"
            echo "::error::the Back probe hit a script error -- checks after it did not run"
            exit 1
          fi

      - name: Check the levels
        # docs/design/beam-levels.md: the arithmetic and the bookkeeping of a
        # gene's level -- the curve, the fork, what a daughter inherits, what a
        # level costs, a sweep that a slow phone must not cross with gaps in it,
        # and a skip that must not change what a ray hits. None of it shows in a
        # render, and a player would find a fault in it an hour into a run.
        # Grepped, not trusted to the exit code, for the reason the Back probe
        # gives.
        run: |
          set -uo pipefail
          # timeout: a parse error leaves Godot running rather than exiting,
          # and a job that waits on it waits for GitHub's six hours.
          out=$(timeout 300 ~/godot/godot --headless --path . res://tools/levels_probe.tscn 2>&1) || true
          grep -E "^\[levels-probe\]" <<< "$out" || true
          if ! grep -q "^\[levels-probe\] ALL PASS$" <<< "$out"; then
            grep -E -A2 "SCRIPT ERROR|Parse Error|ERROR:" <<< "$out" || true
            echo "::error::a level, a price or the fan is wrong -- see the probe lines above"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error" <<< "$out"; then
            grep -E -A2 "SCRIPT ERROR|Parse Error" <<< "$out"
            echo "::error::the levels probe hit a script error -- checks after it did not run"
            exit 1
          fi

      - name: Check the drop
        # docs/design/ocean.md §14.3: what the finite water is built on. The
        # grid against brute force over 10,000 queries, the basin's rim against
        # the rim sampled, the spawner's debt and the snow's draws against
        # their own arithmetic, the drop's own decisions one at a time, the LOD
        # reaches against every sense in the tables, one tank: the player's
        # metabolism node against the static functions the water calls, to
        # 1e-6 -- and the dev app's frame readout, which this release-stamped
        # job would never draw: nothing added to a release build, the dropped
        # share the phone gate reads, and nothing shown or counted under the
        # pause page. Then the drop's own rules, run in the drop: nothing made
        # where a player can see it, containment, growth, the floors, the LOD,
        # determinism, the flocs and remains, one body for every cell, and the
        # quiet start's push kept clear of the rim. None of it shows in a
        # render -- a grid that misses one body in ten thousand is a hunter
        # that never sees you -- and a player would find it an hour into a
        # run. About forty-five seconds.
        # Grepped, not trusted to the exit code, for the reason the Back probe
        # gives.
        run: |
          set -uo pipefail
          # timeout: a parse error leaves Godot running rather than exiting,
          # and a job that waits on it waits for GitHub's six hours.
          out=$(timeout 300 ~/godot/godot --headless --path . res://tools/drop_probe.tscn 2>&1) || true
          grep -E "^\[drop-probe\]" <<< "$out" || true
          if ! grep -q "^\[drop-probe\] ALL PASS$" <<< "$out"; then
            grep -E -A2 "SCRIPT ERROR|Parse Error|ERROR:" <<< "$out" || true
            echo "::error::the grid, the rim, the spawner, the snow, the tank or the readout is wrong -- see the probe lines above"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error" <<< "$out"; then
            grep -E -A2 "SCRIPT ERROR|Parse Error" <<< "$out"
            echo "::error::the drop probe hit a script error -- checks after it did not run"
            exit 1
          fi

      - name: Check the LAN session
        # Two sessions in ONE headless process, talking ENet over loopback: a
        # guest through a SceneMultiplayer bound to its own subtree with
        # SceneTree.set_multiplayer(api, path), and a host reading its own
        # ENetMultiplayerPeer, every frame through one gate
        # (docs/design/net-hardening.md, part A). Full handshake, raw frames
        # both ways, and the version-skew refusal. Then the door and the gate
        # (`limits`): hostile peers against a host of their own each. Then,
        # with no socket at all, the shared pond's
        # field rules (`pond-field`): two players in one food.gd, the eating
        # rule both ways, the per-player water, and a mirror that must perceive
        # exactly what the field does. Then, also with no socket, the host's
        # referee (`referee`, net-hardening.md part B): the fingerprint of every
        # rule it judges a guest by against wire.gd's RULES -- a rule changed
        # without PROTOCOL fails here -- and each of its rules at its edge.
        # Then two real runs in one pond, and straight after them `pond
        # referee`: a guest driven by hand, as a modified client is, in a real
        # host's water, breaking each rule and then cut. Then the dedicated
        # server (`game/server/`) with two real guests on this build's own
        # PROTOCOL 4 guest code, and its update decisions against a fake release
        # feed and a loopback HTTP server -- no network. Then `invites`
        # (net-hardening.md part C): the invite line and the kept invite, calls
        # by invite over DTLS on loopback and each way one ends, hostile callers
        # at the internet listener, the two doors, the LAN listener closing
        # under a host (part G), and the real server scene with a book of its
        # own. Then `upnp`, the server's forward against a stand-in router. Last,
        # `channel` (game/net/channel.gd): which pair of ports a build is on,
        # posed as a dev build and as a release one -- a dev server and a live
        # one side by side on one address, each guest in with its own.
        #
        # Grepped for a POSITIVE line, for the reason the two steps above spell
        # out twice: Godot exits 0 through script errors, so a network step that
        # only ran would go green with the socket never opened. The probe prints
        # `[net-probe] PASS <what>` per check and `ALL PASS` only if none failed.
        #
        # NO --fixed-fps here, unlike the input step. Every clock in
        # game/net/net_session.gd is wall time -- Android stops the main loop
        # when the app leaves the foreground, so a frame accumulator would
        # report a peer that has been gone two minutes as fresh -- and a
        # headless build at several thousand frames a second would outrun the
        # session's clocks in simulated time: twenty state frames a second
        # while a body swims, the 2 Hz beat while nothing does. --quit-after is
        # a backstop only. The probe makes 368 checks, caps itself at 500
        # frames a second and quits itself in about 188 seconds: some seven in
        # the socket-free pond-field section and well under one in `referee`,
        # which both run inside one frame and spend none of the budget,
        # twenty-three to twenty-seven in `limits`, at up to 100 frames a second,
        # about twenty-five in the pond section, two real runs over loopback,
        # and about six in `pond referee`, both at up to 250 frames a second,
        # about ten in the server's, about seventy-one in `invites`, at up
        # to 50 frames a second, most of it waiting out what a player would --
        # the eight seconds of a call nothing answers, the three of a caller
        # that never proves -- about sixteen in `upnp`, at up to 50, with a
        # stand-in router, and about six in `channel`, at up to 50. Its pond
        # timings are counted in frames, not wall milliseconds, so a loaded
        # runner slows the step without failing it. It prints its own frame
        # count -- 15,070 with `channel`'s 240, as it was 15,070 with
        # `upnp`'s 800 before `channel`, against 14,300 to 14,750 measured
        # eight times before that -- so the margin on 20000 is visible in the
        # log.
        #
        # WHAT THIS CANNOT SEE, and it is most of a real network: latency,
        # jitter, loss, reordering, MTU, NAT, Wi-Fi roaming, Android doze or
        # `onActivityStopped`, and `godotengine/godot#105726` -- ENet clients
        # disconnecting at random over a LAN, which is documented NOT to
        # reproduce on localhost, which is exactly this recipe. Two phones on
        # real Wi-Fi for half an hour is the test this is not.
        run: |
          set -uo pipefail
          out=$(~/godot/godot --headless --path . --quit-after 20000 \
                  res://tools/net_probe.tscn 2>&1) || true
          printf '%s\n' "$out" | grep -E "^\[net-probe\]" || true
          if ! grep -q "^\[net-probe\] ALL PASS$" <<< "$out"; then
            printf '%s\n' "$out" | grep -E "SCRIPT ERROR|Parse Error|ERROR:" || true
            echo "::error::the LAN session did not come up -- see the probe lines above"
            exit 1
          fi
          # The same guard as the Back step's, and it matters more here: the
          # pond-field section reaches food.gd's own functions by name, so a
          # rename there is a runtime error that skips the rest of a section
          # while the probe still prints ALL PASS. A clean run prints none. A
          # here-string, as the Back step's is (#110).
          if grep -qE "SCRIPT ERROR|Parse Error" <<< "$out"; then
            printf '%s\n' "$out" | grep -E -A2 "SCRIPT ERROR|Parse Error"
            echo "::error::the LAN probe hit a script error -- checks after it did not run"
            exit 1
          fi

      - name: Fuzz the network code
        # tools/net_fuzz.gd (issue #91, net-hardening.md part D): everything
        # that reads what a stranger sends, fed what a stranger could send and
        # checked after every step -- the wire's decoders where the gate reads
        # them, a real host's door and gate on both listeners with callers
        # driven by hand, a guest's side of the handshake, invite pastes, the
        # doors' address tests, and the referee. The saved cases in
        # tools/net_fuzz_corpus.txt run first, every time.
        #
        # IN A NETWORK NAMESPACE OF ITS OWN. The door binds the real LAN and
        # internet ports, and refuses to run where any interface but loopback
        # could reach them. `unshare --net` needs root;
        # Godot does not, so it runs as this job's user again -- nothing it
        # writes, the import cache or user://, is root's when the exports
        # below come to write them. The address on lo is one the LAN host can
        # take.
        #
        # Seed 1 at scale 1: every run of this step is the same run, some five
        # seconds of it. `timeout` is the backstop -- a script that does not
        # parse leaves the scene up forever. A failure prints what broke and a
        # `--replay=` of it, minimised; other seeds and `--scale=20` are the
        # longer look, run locally (the header of net_fuzz.gd says how).
        run: |
          set -uo pipefail
          out=$(sudo unshare --net -- bash -c '
              ip link set lo up && ip addr add 10.77.0.5/24 dev lo &&
              exec setpriv --reuid="$1" --regid="$2" --clear-groups env HOME="$3" \
                timeout 300 "$3/godot/godot" --headless --path "$4" \
                res://tools/net_fuzz.tscn -- --seed=1' \
            _ "$(id -u)" "$(id -g)" "$HOME" "$PWD" 2>&1) || true
          grep -E "^\[net-fuzz\]" <<< "$out" || true
          # Here-strings, not `printf | grep -q`: under pipefail, grep -q
          # leaving at an early match is SIGPIPE to printf, and a 450 KB log's
          # match near the top reads as no match at all.
          if ! grep -q "^\[net-fuzz\] ALL PASS$" <<< "$out"; then
            grep -E "SCRIPT ERROR|Parse Error" <<< "$out" || true
            echo "::error::the network fuzzer found something, or did not finish -- see its lines above"
            exit 1
          fi
          # The fuzzer fails a step on any script error in the code it drives;
          # this catches one in the fuzzer itself, which may have skipped a check.
          if grep -qE "SCRIPT ERROR|Parse Error" <<< "$out"; then
            grep -E -A2 "SCRIPT ERROR|Parse Error" <<< "$out"
            echo "::error::the network fuzzer hit a script error -- checks after it did not run"
            exit 1
          fi

      - name: Take the network from under a host
        # tools/net_drop.gd (issue #105, net-hardening.md part G): a send that
        # really fails. A dedicated host on an address of lo, with a guest in;
        # when it prints `ready` this shell -- root in the namespace, which
        # Godot is not -- takes the address away, and the host's next send
        # fails. ENet closes a listener whose send fails, and the host must say
        # so, let its guest go and listen again at once. When it prints
        # `dropped` the address comes back, and a new guest must be in. The
        # probe's `invites` H1-H4 close the listener by hand, as 4.7 does after
        # a failed send; this is the one check that the send fails and ENet
        # closes it, which an engine upgrade could change.
        #
        # The same namespace and the same user as the fuzz step above. About a
        # second; `timeout` is the backstop for a scene that never ends, and
        # each wait here gives up after thirty seconds, or at once if Godot has
        # gone.
        run: |
          set -uo pipefail
          out=$(sudo unshare --net -- bash -c '
              ip link set lo up && ip addr add 10.77.0.5/24 dev lo || exit 1
              log=$(mktemp)
              setpriv --reuid="$1" --regid="$2" --clear-groups env HOME="$3" \
                timeout 60 "$3/godot/godot" --headless --path "$4" \
                res://tools/net_drop.tscn > "$log" 2>&1 &
              godot=$!
              step() {
                for _ in $(seq 300); do
                  grep -q "^\[net-drop\] $1" "$log" && return 0
                  kill -0 "$godot" 2>/dev/null || return 1
                  sleep 0.1
                done
                return 1
              }
              step ready && ip addr del 10.77.0.5/24 dev lo
              step dropped && ip addr add 10.77.0.5/24 dev lo
              wait "$godot"
              cat "$log"' \
            _ "$(id -u)" "$(id -g)" "$HOME" "$PWD" 2>&1) || true
          grep -E "^\[net-drop\]|^\[net\]" <<< "$out" || true
          if ! grep -q "^\[net-drop\] ALL PASS$" <<< "$out"; then
            grep -E "SCRIPT ERROR|Parse Error|ERROR:|WARNING:" <<< "$out" || true
            echo "::error::a host did not come back from its network going -- see the lines above"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error" <<< "$out"; then
            grep -E -A2 "SCRIPT ERROR|Parse Error" <<< "$out"
            echo "::error::the network-drop check hit a script error"
            exit 1
          fi

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.path }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/${{ steps.version.outputs.apk_name }}

      - name: Export Windows executable
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/${{ steps.version.outputs.exe_name }}

      - name: Export the Linux server
        run: |
          mkdir -p build/linux
          ~/godot/godot --headless --path . --export-release "Linux Server" build/linux/biogenic-server.x86_64

      - name: Export content packs
        run: |
          mkdir -p build/content
          ~/godot/godot --headless --path . --export-pack "Android" build/content/content-android.pck
          ~/godot/godot --headless --path . --export-pack "Windows Desktop" build/content/content-windows.pck
          ~/godot/godot --headless --path . --export-pack "Linux Server" build/content/content-linux.pck

      - name: Smoke-boot the Linux server
        # **The exported binary, not the editor**, because the thing that makes
        # it a server is only true of an export: an official 4.7 release
        # template cannot be told which scene to run, so it boots
        # `run/main_scene.server` through the preset's `server` feature, and a
        # preset or override that went wrong boots the launcher instead -- and
        # waits for a Play press forever, printing nothing wrong. So this greps
        # for the server's own positive line, READY, and for nothing else.
        #
        # **And it stops the way systemd stops it**: by the stop file its unit's
        # ExecStop touches, because Godot does not catch SIGTERM (measured: the
        # process dies at once, status 143). A clean stop prints `[server]
        # stopped` and exits 0. `--no-update` keeps the updater off the
        # network; the one UPnP search the server starts at READY finds no
        # router here, and the stop waits it out -- four seconds at most.
        #
        # Grepped for SCRIPT ERROR and Parse Error as well, for the reason the
        # scene step above spells out: Godot exits 0 straight through them.
        #
        # **And it answers the pre-flight**: every installed server asks a new
        # build `--headless --version` before swapping it in, and refuses one
        # that does not exit 0 naming a version (game/server/updater.gd,
        # `preflight()`). A template that answered any other way would be
        # refused by every server there is, so it is refused here first.
        run: |
          set -uo pipefail
          stop="$RUNNER_TEMP/biogenic-server.stop"
          log="$RUNNER_TEMP/biogenic-server.log"
          rm -f "$stop"
          timeout 90 build/linux/biogenic-server.x86_64 --headless -- \
            --no-update --stop-file="$stop" > "$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 150); do
            grep -q '^\[server\] READY' "$log" && break
            sleep 0.2
          done
          touch "$stop"
          # `|| code=$?`, not `code=$?` after it: the step shell is `bash -e`,
          # which would leave on a failed wait before the log is printed.
          code=0
          wait "$pid" || code=$?
          cat "$log"
          fail=0
          if ! grep -q '^\[server\] READY' "$log"; then
            echo "::error::the exported server never said READY -- did it boot the launcher instead?"
            fail=1
          fi
          if ! grep -q '^\[server\] stopped' "$log" || [ "$code" -ne 0 ]; then
            echo "::error::the exported server did not stop cleanly on its stop file (exit $code)"
            fail=1
          fi
          if grep -E "SCRIPT ERROR|Parse Error" "$log"; then
            echo "::error::the exported server reported script errors"
            fail=1
          fi
          # The updater's pre-flight, as it asks it: exit 0, and a version (N.M...).
          asked=0
          said=$(build/linux/biogenic-server.x86_64 --headless --version 2>/dev/null) || asked=$?
          echo "pre-flight: --version exited $asked and said '$said'"
          if [ "$asked" -ne 0 ] || ! [[ "$said" =~ ^[1-9][0-9]*\.[0-9] ]]; then
            echo "::error::the exported server fails the pre-flight every installed server puts a new build through"
            fail=1
          fi
          exit "$fail"

      - name: Check the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning ci/*.sh server/*.sh

      - name: Upload build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: build-pr-${{ github.event.pull_request.number || github.run_id }}
          path: |
            build/android/${{ steps.version.outputs.apk_name }}
            build/windows/${{ steps.version.outputs.exe_name }}
            build/linux/biogenic-server.x86_64
            build/content/*.pck
          if-no-files-found: error
          retention-days: 7
